<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Aventura Rafting</title>
    <meta name="description"
      content="Agende já seu passeio de Rafting nas melhores corredeiras do estado.">
    <meta name="author" content="Leonardo Azevedo">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/passeiorafting.png" alt="Logotipo Site Rafting" width="128" height="128">

        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <h1>Aventura Rafting</h1>
        <p>Rua das Corredeiras, 123 – Foz do Iguaçu, PR</p>
        <p>Telefone:+55 41 99999-9999</p>
        <p>contato@aventurarafting.com</p>

        <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d39680.19946243067!2d-54.478449195405545!3d-25.60318848388797!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1795869880219!5m2!1spt-BR!2sbr"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

        <form>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome">
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email">
            <label for="consulta-geral">Consulta Geral</label>
            <input type="radio" name="finalidade" id="consulta-geral" value="consulta-geral">
            <label for="perguntas-reserva">Pergunta sobre Reserva</label>
            <input type="radio" name="finalidade" id="perguntas-reserva" value="perguntas-reserva">
            <label for="sugestao-site">Sugestão de Site</label>
            <input type="radio" name="finalidade" id="sugestao-site" value="sugestao-site">
            <label for="mensagem">Mensagem</label>
            <textarea name="mensagem" id="mensagem"></textarea>
            <label for="newsletter">Quero receber a newsletter mensal</label>
            <input type="checkbox" name="newsletter" id="newsletter">

            <button type="submit">Enviar Mensagem</button>
        </form>

        <section class="equipe">
            <h2>Nossa Equipe</h2>

            <figure>
                <img src="imagens/guia-rafting.png" alt="Guia de rafting usando capacete e colete">
                <figcaption>Guia de Rafting</figcaption>
                <img src="imagens/instrutora-rafting.png"
                  alt="Instrutora de Segurança de rafting usando capacete e colete">
                <figcaption>Instrutora de Segurança</figcaption>
                <img src="imagens/atendente-reservas.png"
                  alt="Atendente de Reserva para passeios de Rafting">
                <figcaption>Atendente de Reservas</figcaption>
        </section>
    </main>

    <footer>
        <p>© 2026 Aventura Rafting Leonardo Azevedo</p>
        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/imagemfacebook.png" alt="Ícone do Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="imagens/imagemlinkedin.png" alt="Ícone do Linkedin">
            </a>
            <a href="https://instagram.com">
                <img src="imagens/imageminstagram.png" alt="Ícone do Instragram">
            </a>
        </nav>
    </footer>

</body>

</html>
